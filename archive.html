  <script>
    // ── 다크/라이트 테마 토글 (index.html과 동일한 localStorage 키 공유) ──
    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle('light-mode');
      const icon = document.getElementById('themeIcon');
      if (icon) icon.textContent = isLight ? '☀️' : '🌙';
      try { localStorage.setItem('1dayeco_theme', isLight ? 'light' : 'dark'); } catch (_) {}
    }
    // 헤더의 아이콘은 DOM 준비 후에만 존재하므로 로드 시점에 맞춰 갱신
    window.addEventListener('DOMContentLoaded', () => {
      const icon = document.getElementById('themeIcon');
      if (icon) icon.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    });

    // ── Supabase 초기화 ──
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ── 상태 ──
    let allCategories = [];
    let currentCat    = 'all';
    let page          = 0;
    const PAGE_SIZE   = 20;
    let loading       = false;
    let hasMore       = true;
    // 주제(subtopic) 단위 그룹핑 — 목록을 이어붙일 때 같은 주제면 새 섹션을 만들지 않음
    let lastSubtopicId    = undefined;
    let currentCardsWrap  = null;

    // ── 콘텐츠 생성일(created_at)은 의미 없는 값이라 대신 주제 안에서
    // 몇 번째 화인지(seq)를 "N번째"로 표시 ──
    function fmtSeqLabel(item) {
      return item.seq ? `${item.seq}번째` : '';
    }

    // ── 카테고리 정보 조회 (id → {name, emoji}) ──
    let categoryMeta = {};
    function catInfo(id) {
      return categoryMeta[id] || { name: id, emoji: '📄' };
    }

    // ── 카테고리 로드 ──
    // contents.category 컬럼은 카테고리의 id(예: 'english')를 저장하므로
    // 필터 버튼도 id를 키로 사용해야 함. 'coming_soon' 상태 카테고리는
    // 아직 판매 전이므로 무료 아카이브에서도 노출하지 않음 (api.py의
    // 판매중 카테고리 판정 로직과 동일한 기준).
    async function loadCategories() {
      const { data } = await sb
        .from('categories')
        .select('id, name, emoji, display_order, visibility')
        .eq('active', true)
        .order('display_order');

      if (!data) return;
      allCategories = data.filter(c => (c.visibility || 'active') === 'active');
      allCategories.forEach(c => { categoryMeta[c.id] = { name: c.name, emoji: c.emoji }; });

      const wrap = document.getElementById('filters');
      allCategories.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = c.id;
        btn.textContent = `${c.emoji} ${c.name}`;
        btn.addEventListener('click', () => selectCategory(c.id));
        wrap.appendChild(btn);
      });
    }

    // ── 카테고리 선택 ──
    function selectCategory(cat) {
      currentCat = cat;
      page = 0;
      hasMore = true;
      lastSubtopicId = undefined;
      currentCardsWrap = null;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      document.getElementById('content-list').innerHTML =
        '<div class="loading">콘텐츠를 불러오는 중...</div>';
      loadContents();
    }

    // ── 콘텐츠 로드 ──
    async function loadContents(append = false) {
      if (loading) return;
      loading = true;

      // 정렬: 주제(subtopic) 안에서 seq(1화→2화) 순서로 읽히도록.
      // subtopics.display_order는 카테고리 간에도 전역적으로 이어지는 값이라
      // (금융→테크→외국어…) '전체' 보기에서도 대분류/카테고리 순서가 자연히 맞음.
      //
      // supabase-js의 .order(col, {foreignTable}) 옵션은 1:N 임베드 배열 내부를
      // 정렬하는 `subtopics.order=` 파라미터를 만들어서, 이 페이지처럼 N:1로
      // 임베드된 subtopics 컬럼 기준으로 바깥 contents 행 자체를 정렬하려는
      // 목적에는 안 맞는다(직접 확인함). PostgREST가 지원하는
      // `order=subtopics(display_order)` 문법을 쓰려면 REST 엔드포인트를
      // 직접 fetch해야 해서, 이 조회만 supabase-js 빌더를 안 쓰고 직접 호출.
      const params = new URLSearchParams();
      params.set('select', 'id,date_str,category,headline,body,tags,subtopic_id,seq,subtopics(name,display_order),created_at');
      params.set('hidden', 'eq.false');
      if (currentCat !== 'all') params.set('category', 'eq.' + currentCat);
      params.set('order', 'subtopics(display_order).asc,seq.asc');
      params.set('limit', String(PAGE_SIZE));
      params.set('offset', String(page * PAGE_SIZE));

      let data = null, error = null;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/contents?${params.toString()}`, {
          headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
        });
        if (res.ok) {
          data = await res.json();
        } else {
          error = await res.json().catch(() => ({ message: 'request failed' }));
        }
      } catch (e) {
        error = e;
      }

      loading = false;
      const list = document.getElementById('content-list');
      const btn  = document.getElementById('load-more');

      if (error) {
        list.innerHTML = '<div class="empty">콘텐츠를 불러오지 못했습니다.</div>';
        btn.style.display = 'none';
        return;
      }

      if (!append) {
        list.innerHTML = '';
        lastSubtopicId = undefined;
        currentCardsWrap = null;
      }

      if (!data || data.length === 0) {
        if (!append) {
          list.innerHTML = '<div class="empty">📭 아직 공개된 콘텐츠가 없습니다.</div>';
        }
        btn.style.display = 'none';
        hasMore = false;
        return;
      }

      data.forEach(item => {
        // 같은 주제(subtopic)가 이어지면 섹션을 새로 만들지 않고 카드만 이어붙임
        // (load more로 페이지가 나뉘어도 같은 주제 중간이면 헤더가 중복되지 않음)
        const subtopicKey = item.subtopic_id ?? null;
        if (subtopicKey !== lastSubtopicId || !currentCardsWrap) {
          lastSubtopicId = subtopicKey;
          const info = catInfo(item.category);
          const subName = item.subtopics?.name || null;

          const section = document.createElement('div');
          section.className = 'subtopic-section';

          if (subName) {
            const header = document.createElement('div');
            header.className = 'subtopic-header';
            header.textContent = currentCat === 'all'
              ? `${info.emoji} ${info.name} · ${subName}`
              : `${info.emoji} ${subName}`;
            section.appendChild(header);
          }

          const cardsWrap = document.createElement('div');
          cardsWrap.className = 'subtopic-cards';
          section.appendChild(cardsWrap);

          list.appendChild(section);
          currentCardsWrap = cardsWrap;
        }

        const card = document.createElement('div');
        card.className = 'content-card';
        card.addEventListener('click', () => openDetail(item));

        let tagsHtml = '';
        if (item.tags) {
          const tagArr = typeof item.tags === 'string'
            ? item.tags.split(',').map(t => t.trim())
            : item.tags;
          tagsHtml = '<div class="card-tags">' +
            tagArr.slice(0, 4).map(t => `<span class="card-tag">${t.startsWith('#') ? t : '#' + t}</span>`).join('') +
            '</div>';
        }

        const info = catInfo(item.category);
        const seqHtml = fmtSeqLabel(item);
        card.innerHTML = `
          <div class="card-meta">
            <span class="card-emoji">${info.emoji}</span>
            <span class="card-category">${info.name}</span>
            ${seqHtml ? `<span class="card-seq">${seqHtml}</span>` : ''}
          </div>
          <div class="card-headline">${escHtml(item.headline)}</div>
          ${tagsHtml}
        `;
        currentCardsWrap.appendChild(card);
      });

      hasMore = data.length === PAGE_SIZE;
      btn.style.display = hasMore ? 'block' : 'none';
    }

    // ── 상세 보기 ──
    function openDetail(item) {
      const info = catInfo(item.category);
      const seqHtml = fmtSeqLabel(item);
      document.getElementById('detail-meta').innerHTML = `
        <span class="card-emoji">${info.emoji}</span>
        <span class="card-category">${info.name}</span>
        ${seqHtml ? `<span class="card-seq">${seqHtml}</span>` : ''}
        ${item.subtopics?.name ? `<span style="color:var(--muted)">· ${item.subtopics.name}</span>` : ''}
      `;
      document.getElementById('detail-headline').textContent = item.headline;
      document.getElementById('detail-body').innerHTML = formatBody(item.body || '');

      const tagsEl = document.getElementById('detail-tags');
      tagsEl.innerHTML = '';
      if (item.tags) {
        const tagArr = typeof item.tags === 'string'
          ? item.tags.split(',').map(t => t.trim())
          : item.tags;
        tagArr.forEach(t => {
          const span = document.createElement('span');
          span.className = 'card-tag';
          span.textContent = t.startsWith('#') ? t : '#' + t;
          tagsEl.appendChild(span);
        });
      }

      const overlay = document.getElementById('detail-overlay');
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';

      // URL 해시 업데이트
      history.pushState(null, '', `#${item.id}`);
    }

    function closeDetail() {
      document.getElementById('detail-overlay').classList.remove('show');
      document.body.style.overflow = '';
      history.pushState(null, '', location.pathname);
    }

    // ── 본문 포맷 ──
    function formatBody(text) {
      return escHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    // ── HTML 이스케이프 ──
    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── 이벤트 바인딩 ──
    document.getElementById('detail-close').addEventListener('click', closeDetail);
    document.getElementById('detail-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeDetail();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDetail();
    });
    document.querySelector('[data-cat="all"]').addEventListener('click', () => selectCategory('all'));
    document.getElementById('load-more').addEventListener('click', () => {
      page++;
      loadContents(true);
    });

    // ── 초기 로드 ──
    (async () => {
      await loadCategories();
      await loadContents();

      // URL 해시로 직접 접근 시
      if (location.hash) {
        const id = location.hash.slice(1);
        const { data } = await sb
          .from('contents')
          .select('id, date_str, category, headline, body, tags, subtopic_id, subtopics(name), created_at')
          .eq('id', id)
          .eq('hidden', false)
          .single();
        if (data) {
          openDetail(data);
        }
      }
    })();

    // 뒤로가기 시 상세 닫기
    window.addEventListener('popstate', closeDetail);
  </script>

</body>
</html>
