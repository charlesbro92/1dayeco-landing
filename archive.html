<!DOCTYPE html>
<html lang="ko">
<head>

  <!-- ★ Supabase 설정: 본인의 값으로 교체 -->
  <script>
    const SUPABASE_URL  = 'https://qsumgdfqtozyjqthdhal.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdW1nZGZxdG96eWpxdGhkaGFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzMyNTcsImV4cCI6MjA5MzA0OTI1N30.uRDndIXjVhnqqg5sEYr1S7THkHefc2NQuMfiohYQhS4';
  </script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #12121a;
      --card:      #1a1a25;
      --card-hover:#22222f;
      --border:    #2a2a3a;
      --text:      #e4e4ec;
      --text-sub:  #9090a8;
      --accent:    #4a90d9;
      --accent-bg: rgba(74,144,217,0.12);
      --tag-bg:    rgba(74,144,217,0.15);
      --tag-text:  #7ab4f5;
      --cta-bg:    #4a90d9;
      --cta-hover: #3a7bc8;
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .header-logo span { color: var(--accent); }
    .header-home {
      font-size: 13px;
      color: var(--text-sub);
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .header-home:hover {
      border-color: var(--accent);
      color: var(--text);
      text-decoration: none;
    }

    /* ── Main Container ── */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ── Page Title ── */
    .page-title {
      margin-bottom: 12px;
    }
    .page-title h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.3;
    }
    .page-title h1 span { color: var(--accent); }
    .page-desc {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 32px;
    }

    /* ── Category Filter ── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .filter-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* ── Content List ── */
    .content-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .content-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .content-card:hover {
      background: var(--card-hover);
      border-color: #3a3a50;
      transform: translateY(-1px);
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .card-emoji { font-size: 16px; }
    .card-category {
      background: var(--accent-bg);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .card-date { color: var(--text-sub); }
    .card-headline {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .card-tag {
      font-size: 12px;
      color: var(--tag-text);
      background: var(--tag-bg);
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ── Detail View ── */
    .detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .detail-overlay.show { display: flex; }

    .detail-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      padding: 36px 32px 40px;
      position: relative;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .detail-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .detail-close:hover { background: var(--card); color: var(--text); }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-sub);
    }
    .detail-headline {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }
    .detail-body {
      font-size: 15px;
      line-height: 1.85;
      color: #d0d0de;
      white-space: pre-wrap;
      word-break: keep-all;
    }
    .detail-body strong, .detail-body b {
      color: var(--text);
      font-weight: 700;
    }
    .detail-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* ── CTA Banner ── */
    .cta-banner {
      background: linear-gradient(135deg, #1a2a44 0%, #1a1a30 100%);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      margin-top: 40px;
    }
    .cta-banner p {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .cta-banner h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .cta-btn {
      display: inline-block;
      background: var(--cta-bg);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 32px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .cta-btn:hover {
      background: var(--cta-hover);
      text-decoration: none;
    }

    .detail-cta {
      background: var(--accent-bg);
      border: 1px solid rgba(74,144,217,0.3);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-top: 28px;
    }
    .detail-cta p {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    /* ── Load More ── */
    .load-more {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .load-more:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    /* ── States ── */
    .loading, .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 15px;
    }
    .loading::before {
      content: '';
      display: block;
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      border-top: 1px solid var(--border);
    }
    .footer a { color: var(--text-sub); }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .container { padding: 28px 16px 60px; }
      .page-title h1 { font-size: 22px; }
      .content-card { padding: 16px 18px; }
      .card-headline { font-size: 15px; }
      .detail-panel { padding: 28px 20px 32px; }
      .detail-headline { font-size: 19px; }
      .detail-overlay { padding: 20px 12px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">1DAY<span>ECO</span> · 아카이브</div>
      <a href="/" class="header-home">← 서비스 소개</a>
    </div>
  </header>

  <!-- Main -->
  <main class="container">

    <div class="page-title">
      <h1>무료 <span>지식 아카이브</span></h1>
    </div>
    <p class="page-desc">매일 아침 카카오톡으로 발송된 1분 지식을 무료로 읽어보세요.</p>

    <!-- Category Filters -->
    <div class="filters" id="filters">
      <button class="filter-btn active" data-cat="all">전체</button>
      <!-- JS에서 자동 생성 -->
    </div>

    <!-- Content List -->
    <div id="content-list" class="content-list">
      <div class="loading">콘텐츠를 불러오는 중...</div>
    </div>

    <!-- Load More -->
    <button class="load-more" id="load-more" style="display:none">
      이전 콘텐츠 더 보기 ↓
    </button>

    <!-- CTA -->
    <div class="cta-banner">
      <p>여기서 읽는 것보다 더 편한 방법</p>
      <h3>📬 매일 아침 카톡으로 받기</h3>
      <a href="/" class="cta-btn">무료 체험 시작하기 →</a>
    </div>

  </main>

  <!-- Detail Overlay -->
  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-panel" id="detail-panel">
      <button class="detail-close" id="detail-close">✕</button>
      <div class="detail-meta" id="detail-meta"></div>
      <h2 class="detail-headline" id="detail-headline"></h2>
      <div class="detail-body" id="detail-body"></div>
      <div class="detail-tags" id="detail-tags"></div>
      <div class="detail-cta">
        <p>이 콘텐츠가 매일 아침 카톡으로 도착합니다</p>
        <a href="/" class="cta-btn">무료 체험 시작하기 →</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 1DAYECO. All rights reserved. · 
      <a href="/terms.html">이용약관</a> · 
      <a href="/privacy.html">개인정보처리방침</a>
    </p>
  </footer>

  <script>
    // ── Supabase 초기화 ──
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ── 상태 ──
    let allCategories = [];
    let currentCat    = 'all';
    let page          = 0;
    const PAGE_SIZE   = 20;
    let loading       = false;
    let hasMore       = true;

    // ── 날짜 포맷: "9월 3일 (수)" (YYYY-MM-DD 문자열 입력) ──
    function fmtDate(str) {
      if (!str) return '';
      const d = new Date(str + 'T00:00:00+09:00');
      const days = ['일','월','화','수','목','금','토'];
      return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    }

    // ── 콘텐츠 카드에 표시할 날짜 (created_at 기준, date_str 미사용) ──
    function fmtCardDate(item) {
      if (item.date_str) return fmtDate(item.date_str);
      if (item.created_at) return fmtDate(item.created_at.slice(0, 10));
      return '';
    }

    // ── 카테고리 정보 조회 (id → {name, emoji}) ──
    let categoryMeta = {};
    function catInfo(id) {
      return categoryMeta[id] || { name: id, emoji: '📄' };
    }

    // ── 카테고리 로드 ──
    // contents.category 컬럼은 카테고리의 id(예: 'english')를 저장하므로
    // 필터 버튼도 id를 키로 사용해야 함. 'coming_soon' 상태 카테고리는
    // 아직 판매 전이므로 무료 아카이브에서도 노출하지 않음 (api.py의
    // 판매중 카테고리 판정 로직과 동일한 기준).
    async function loadCategories() {
      const { data } = await sb
        .from('categories')
        .select('id, name, emoji, display_order, visibility')
        .eq('active', true)
        .order('display_order');

      if (!data) return;
      allCategories = data.filter(c => (c.visibility || 'active') === 'active');
      allCategories.forEach(c => { categoryMeta[c.id] = { name: c.name, emoji: c.emoji }; });

      const wrap = document.getElementById('filters');
      allCategories.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = c.id;
        btn.textContent = `${c.emoji} ${c.name}`;
        btn.addEventListener('click', () => selectCategory(c.id));
        wrap.appendChild(btn);
      });
    }

    // ── 카테고리 선택 ──
    function selectCategory(cat) {
      currentCat = cat;
      page = 0;
      hasMore = true;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      document.getElementById('content-list').innerHTML =
        '<div class="loading">콘텐츠를 불러오는 중...</div>';
      loadContents();
    }

    // ── 콘텐츠 로드 ──
    async function loadContents(append = false) {
      if (loading) return;
      loading = true;

      let q = sb
        .from('contents')
        .select('id, date_str, category, headline, body, tags, subtopic_id, subtopics(name), created_at')
        .eq('hidden', false)
        .order('created_at', { ascending: false })
        .range(page * PAGE_SIZE, (page + 1) * PAGE_SIZE - 1);

      if (currentCat !== 'all') {
        q = q.eq('category', currentCat);
      }

      const { data, error } = await q;

      loading = false;
      const list = document.getElementById('content-list');
      const btn  = document.getElementById('load-more');

      if (error) {
        list.innerHTML = '<div class="empty">콘텐츠를 불러오지 못했습니다.</div>';
        btn.style.display = 'none';
        return;
      }

      if (!append) list.innerHTML = '';

      if (!data || data.length === 0) {
        if (!append) {
          list.innerHTML = '<div class="empty">📭 아직 공개된 콘텐츠가 없습니다.</div>';
        }
        btn.style.display = 'none';
        hasMore = false;
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'content-card';
        card.addEventListener('click', () => openDetail(item));

        let tagsHtml = '';
        if (item.tags) {
          const tagArr = typeof item.tags === 'string'
            ? item.tags.split(',').map(t => t.trim())
            : item.tags;
          tagsHtml = '<div class="card-tags">' +
            tagArr.slice(0, 4).map(t => `<span class="card-tag">${t.startsWith('#') ? t : '#' + t}</span>`).join('') +
            '</div>';
        }

        const info = catInfo(item.category);
        const dateHtml = fmtCardDate(item);
        card.innerHTML = `
          <div class="card-meta">
            <span class="card-emoji">${info.emoji}</span>
            <span class="card-category">${info.name}</span>
            ${dateHtml ? `<span class="card-date">${dateHtml}</span>` : ''}
          </div>
          <div class="card-headline">${escHtml(item.headline)}</div>
          ${tagsHtml}
        `;
        list.appendChild(card);
      });

      hasMore = data.length === PAGE_SIZE;
      btn.style.display = hasMore ? 'block' : 'none';
    }

    // ── 상세 보기 ──
    function openDetail(item) {
      const info = catInfo(item.category);
      const dateHtml = fmtCardDate(item);
      document.getElementById('detail-meta').innerHTML = `
        <span class="card-emoji">${info.emoji}</span>
        <span class="card-category">${info.name}</span>
        ${dateHtml ? `<span class="card-date">${dateHtml}</span>` : ''}
        ${item.subtopics?.name ? `<span style="color:var(--text-sub)">· ${item.subtopics.name}</span>` : ''}
      `;
      document.getElementById('detail-headline').textContent = item.headline;
      document.getElementById('detail-body').innerHTML = formatBody(item.body || '');

      const tagsEl = document.getElementById('detail-tags');
      tagsEl.innerHTML = '';
      if (item.tags) {
        const tagArr = typeof item.tags === 'string'
          ? item.tags.split(',').map(t => t.trim())
          : item.tags;
        tagArr.forEach(t => {
          const span = document.createElement('span');
          span.className = 'card-tag';
          span.textContent = t.startsWith('#') ? t : '#' + t;
          tagsEl.appendChild(span);
        });
      }

      const overlay = document.getElementById('detail-overlay');
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';

      // URL 해시 업데이트
      history.pushState(null, '', `#${item.id}`);
    }

    function closeDetail() {
      document.getElementById('detail-overlay').classList.remove('show');
      document.body.style.overflow = '';
      history.pushState(null, '', location.pathname);
    }

    // ── 본문 포맷 ──
    function formatBody(text) {
      return escHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    // ── HTML 이스케이프 ──
    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── 이벤트 바인딩 ──
    document.getElementById('detail-close').addEventListener('click', closeDetail);
    document.getElementById('detail-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeDetail();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDetail();
    });
    document.querySelector('[data-cat="all"]').addEventListener('click', () => selectCategory('all'));
    document.getElementById('load-more').addEventListener('click', () => {
      page++;
      loadContents(true);
    });

    // ── 초기 로드 ──
    (async () => {
      await loadCategories();
      await loadContents();

      // URL 해시로 직접 접근 시
      if (location.hash) {
        const id = location.hash.slice(1);
        const { data } = await sb
          .from('contents')
          .select('id, date_str, category, headline, body, tags, subtopic_id, subtopics(name), created_at')
          .eq('id', id)
          .eq('hidden', false)
          .single();
        if (data) {
          openDetail(data);
        }
      }
    })();

    // 뒤로가기 시 상세 닫기
    window.addEventListener('popstate', closeDetail);
  </script>

</body>
</html>
